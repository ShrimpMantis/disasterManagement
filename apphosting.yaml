# apphosting.yaml - Firebase App Hosting Configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure
headers:
  - glob: /_next/static/**
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Client-Side Environment Variables (need BUILD for Next.js inlining)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBVOscGmfvtIQLgqK6Kwwtxp9yTF30cvs8"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "disastermgmt-ccf14.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "disastermgmt-ccf14"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "disastermgmt-ccf14.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "779106552242"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:779106552242:web:d4d249fcf94e37f266fcab"
    availability:
      - BUILD
      - RUNTIME

  # Dual-workflow deployment flag (build-time inlined by Next.js).
  # Community host: CROWDSOURCED (default below).
  # Agency host: create a second App Hosting backend and set ADMIN_SOURCED.
  - variable: NEXT_PUBLIC_OPERATIONAL_MODE
    value: "CROWDSOURCED"
    availability:
      - BUILD
      - RUNTIME

  # Google Maps (client-side; still stored in Secret Manager so it isn't committed).
  # Must be available at BUILD so Next.js can inline NEXT_PUBLIC_* values.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    secret: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
    availability:
      - BUILD
      - RUNTIME

  # Used by Firebase Admin SDK (non-secret; mirrors NEXT_PUBLIC project id)
  - variable: FIREBASE_PROJECT_ID
    value: "disastermgmt-ccf14"
    availability:
      - BUILD
      - RUNTIME

  # Server-Side Private Secrets (Managed via Secret Manager)
  # Provision with: npm run apphosting:secrets
  # SA: firebase-app-hosting-compute@disastermgmt-ccf14.iam.gserviceaccount.com
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
